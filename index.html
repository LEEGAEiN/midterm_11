<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>악마야 놀자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* 한글 폰트: HS봄바람체 2.0 (눈누 웹폰트) */
@font-face{font-family:"HsBombaram20";
 src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/HSBombaram.woff") format("woff"),
     url("https://cdn.jsdelivr.net/gh/fontbee/font@main/Rabbitstype/HSBombaram.woff") format("woff");
 font-weight:normal;font-display:swap}
:root{--u:min(1vw,1.77778vh)}   /* 1u = 화면(16:9)의 가로 1% */
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}
.en{font-family:"UnifrakturMaguntia",serif}
.ko{font-family:"HsBombaram20","Noto Sans KR",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:calc(var(--u)*100);height:calc(var(--u)*56.25);transform:translate(-50%,-50%)}
.scene{position:absolute;inset:0;transition:opacity 1.1s}
.p{position:absolute;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w));height:calc(var(--u)*var(--h))}
.p img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
/* ───── 표지 ───── */
h1,.sub{margin-top: 20px; position:absolute;white-space:nowrap;display:inline-block;font-weight:400;line-height:1;left:calc(var(--u)*3)}
h1{top:calc(var(--u)*.4)} .sub{top:calc(var(--u)*11.8);left:calc(var(--u)*3.7)}
.fire img{position:absolute;left:50%;top:50%;width:calc(var(--u)*6.3);height:calc(var(--u)*20);transform:translate(-50%,-50%) rotate(-90deg)}
.hand{transition:opacity .8s} .using .hand{opacity:0}
.cam{position:absolute;inset:0;margin:auto;width:calc(var(--u)*23.6);height:calc(var(--u)*23.6);border-radius:50%;overflow:hidden;opacity:0;transition:opacity 1s;pointer-events:none}
.cam.live{opacity:1}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam video{filter:grayscale(1) contrast(1.9) brightness(1.05);opacity:.85}
.ring{position:absolute;inset:0;margin:auto;width:calc(var(--u)*40);height:calc(var(--u)*40);overflow:visible;opacity:0;transition:opacity .5s;pointer-events:none}
.ring.on{opacity:1}
.ring g,.ring circle{transform-origin:200px 200px}
.spin{animation:spin 6s linear infinite paused} .spin2{animation:spin 9s linear infinite reverse paused} .march{animation:march 1.2s linear infinite paused}
.ring.on .spin,.ring.on .spin2,.ring.on .march{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes march{to{stroke-dashoffset:-28}}
#ui-prog{stroke-dasharray:1000;stroke-dashoffset:1000}
.msg{position:absolute;left:calc(var(--u)*29.9);top:calc(var(--u)*51.6);width:calc(var(--u)*41.2);text-align:center;font-size:calc(var(--u)*1.25);line-height:1.5;opacity:.8}
.msg{transition:font-size .6s,opacity .6s} .msg.big{font-size:calc(var(--u)*2.6);opacity:1}
.btn{position:absolute;left:calc(var(--u)*73.6);width:calc(var(--u)*16);height:calc(var(--u)*2.9);display:grid;place-items:center;background:#000;color:#fff;border:calc(var(--u)*.12) solid #fff;font-size:calc(var(--u)*1.25);cursor:pointer;padding:0}
.btn:hover,.btn:focus-visible{background:#fff;color:#000;outline:none} .btn:disabled{opacity:.4;cursor:default}
#ui-b1{top:calc(var(--u)*45.5)} #ui-b2{top:calc(var(--u)*49)}
/* ───── 계약 성립 화면 (별도 페이지) ───── */
#pact{display:grid;place-items:center;background:#000;opacity:0;pointer-events:none}
body.pact #pact{opacity:1} body.pact #entry{opacity:0;pointer-events:none}
.pact-t{font-size:calc(var(--u)*5);line-height:1.4;text-align:center;letter-spacing:.04em}
/* ───── 창문 화면 ───── */
#win{opacity:0;pointer-events:none} body.second #win{opacity:1;pointer-events:auto} body.second #entry{opacity:0;pointer-events:none} body.second #pact{opacity:0}
.w{position:absolute;display:block;background:none;border:0;padding:0;cursor:pointer;color:#fff;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w));height:calc(var(--u)*var(--h))}
.w img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.w .on{opacity:0;transition:opacity .45s} .w:hover .on,.w:focus-visible .on{opacity:1}
.w{outline:none}
.lab{position:absolute;left:50%;width:calc(var(--u)*22);transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .45s;pointer-events:none;line-height:1.08}
.w:hover .lab,.w:focus-visible .lab{opacity:1}
.lab.e{bottom:calc(100% + var(--u)*2);font-size:calc(var(--u)*3.2)} .lab.k{top:calc(100% + var(--u)*1.8);font-size:calc(var(--u)*3.2)}
body.second .w{animation:rise 1s both} .w:nth-child(2){animation-delay:.15s!important}.w:nth-child(3){animation-delay:.3s!important}.w:nth-child(4){animation-delay:.45s!important}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*1.5))}}
@media (prefers-reduced-motion:reduce){.spin,.spin2,.march{animation:none!important}}
</style>
</head>
<body>
<div id="stage">

<!-- ══ 1. 표지 ══ -->
<section class="scene" id="entry">
 <h1 class="en" data-fit="94">Come and play, Demon</h1>
 <div class="sub en" data-fit="47">the four great demons of science history</div>

 <div class="p" style="--x:2.8;--y:26.6;--w:7.2;--h:9.6"><img src="herb.png" alt=""></div>
 <div class="p fire" style="--x:11.6;--y:28.6;--w:19.9;--h:6.3"><img src="fire.png" alt=""></div>

 <div class="p" id="ui-seal" style="--x:34.9;--y:19.9;--w:31.2;--h:30.9">
  <svg class="ring" id="ui-ring" viewBox="0 0 400 400" aria-hidden="true">
   <g class="spin" id="ui-ticks" stroke="#fff" stroke-width="1.6"></g>
   <circle class="march" cx="200" cy="200" r="174" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 10"/>
   <circle id="ui-prog" cx="200" cy="200" r="166" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" pathLength="1000" transform="rotate(-90 200 200)"/>
  </svg>
  <img src="magic_circle.png" alt="" style="position:relative">
  <div class="p hand" style="--x:11.3;--y:6.3;--w:8.6;--h:18.2"><img src="hand.png" alt=""></div>
  <div class="cam" id="ui-cam"><video id="ui-video" playsinline muted></video><canvas id="ui-canvas"></canvas></div>
 </div>

 <div class="p" style="--x:72.1;--y:13;--w:22.6;--h:14.6"><img src="lamb.png" alt=""></div>
 <div class="p" style="--x:64.5;--y:44.7;--w:8;--h:7.5"><img src="candle.png" alt=""></div>
 <div class="p" style="--x:91;--y:41.3;--w:6;--h:11.5"><img src="camera.png" alt=""></div>

 <div class="msg ko" id="ui-msg"></div>
 <button class="btn ko" id="ui-b1">카메라를 열고 입장하기</button>
 <button class="btn ko" id="ui-b2">카메라 없이 입장하기</button>
</section>

<!-- ══ 계약 성립 ══ -->
<section class="scene" id="pact"><div class="pact-t ko">계약이 성립되었다.</div></section>

<!-- ══ 2. 네 개의 창 ══ -->
<section class="scene" id="win">
 <button class="w" style="--x:9;--y:12.9;--w:15;--h:27.9" aria-label="Descartes' demon · 데카르트의 악마">
  <img src="window1.png" alt=""><img class="on" src="window12.png" alt="">
  <div class="lab e en">Descartes'<br>demon</div><div class="lab k ko">데카르트의<br>악마</div></button>
 <button class="w" style="--x:31.4;--y:12.8;--w:15.4;--h:28.2" aria-label="Maxwell's demon · 맥스웰의 악마">
  <img src="window2.png" alt=""><img class="on" src="window22.png" alt="">
  <div class="lab e en">Maxwell's<br>demon</div><div class="lab k ko">맥스웰의<br>악마</div></button>
 <button class="w" style="--x:53.4;--y:13.1;--w:15.1;--h:27.9" aria-label="Darwin's demon · 다윈의 악마">
  <img src="window3.png" alt=""><img class="on" src="window32.png" alt="">
  <div class="lab e en">Darwin's<br>demon</div><div class="lab k ko">다윈의<br>악마</div></button>
 <button class="w" style="--x:75.7;--y:13.6;--w:13.4;--h:26.5" aria-label="Laplace's demon · 라플라스의 악마">
  <img src="window4.png" alt=""><img class="on" src="window42.png" alt="">
  <div class="lab e en">Laplace's<br>demon</div><div class="lab k ko">라플라스의<br>악마</div></button>
</section>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const seal = $('ui-seal'), cam = $('ui-cam'), v = $('ui-video'), cv = $('ui-canvas'), ctx = cv.getContext('2d');
const msg = $('ui-msg'), prog = $('ui-prog'), ring = $('ui-ring');
msg.textContent = '';

/* 제목 글자를 목표 너비(u 단위)에 맞춰 키움 */
function fit() {
  const u = Math.min(innerWidth / 100, innerHeight / 56.25);
  document.querySelectorAll('[data-fit]').forEach(el => {
    el.style.fontSize = '10px'; const w = el.getBoundingClientRect().width;
    el.style.fontSize = (10 * parseFloat(el.dataset.fit) * u / w) + 'px';
  });
}
document.fonts.ready.then(fit); addEventListener('resize', fit); fit();

/* 마법진 둘레 광선 */
let t = ''; for (let i = 0; i < 72; i++) { const a = i * 5 * Math.PI / 180, r1 = 182, r2 = i % 2 ? 190 : 200;
  t += `<line x1="${200+Math.cos(a)*r1}" y1="${200+Math.sin(a)*r1}" x2="${200+Math.cos(a)*r2}" y2="${200+Math.sin(a)*r2}"/>`; }
$('ui-ticks').innerHTML = t;


/* 새로 생기는 원(웹캠·광륜)을 마법진 PNG의 실제 중심·크기에 맞춰 배치 */
const mc = seal.querySelector('img');
let bb = null;
function analyze() {
  const nw = mc.naturalWidth, nh = mc.naturalHeight; if (!nw) return;
  bb = { x0: 0, y0: 0, x1: nw, y1: nh };            // 기본값: 이미지 전체
  try {                                              // 투명 여백이 있으면 실제 그려진 영역만 계산
    const k = Math.min(1, 400 / Math.max(nw, nh)), c = document.createElement('canvas');
    c.width = Math.round(nw * k); c.height = Math.round(nh * k);
    const g = c.getContext('2d'); g.drawImage(mc, 0, 0, c.width, c.height);
    const dt = g.getImageData(0, 0, c.width, c.height).data;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++)
      if (dt[(y * c.width + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 > x0) bb = { x0: x0 / k, y0: y0 / k, x1: (x1 + 1) / k, y1: (y1 + 1) / k };
  } catch (e) { /* file:// 로 열면 픽셀 읽기가 막힘 → 이미지 전체 기준으로 배치 */ }
  place();
}
function put(el, size, cx, cy) {
  Object.assign(el.style, { inset: 'auto', margin: '0', width: size + 'px', height: size + 'px', left: (cx - size / 2) + 'px', top: (cy - size / 2) + 'px' });
}
function place() {
  if (!bb) return;
  const W = seal.clientWidth, H = seal.clientHeight, nw = mc.naturalWidth, nh = mc.naturalHeight;
  const sc = Math.min(W / nw, H / nh), ox = (W - nw * sc) / 2, oy = (H - nh * sc) / 2;
  const cx = ox + (bb.x0 + bb.x1) / 2 * sc, cy = oy + (bb.y0 + bb.y1) / 2 * sc;
  const r = Math.max(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 * sc;
  put(cam, r * 2 * 0.75, cx, cy);      // 웹캠 원: 마법진 안쪽 원
  put(ring, r * 2 * 1.28, cx, cy);     // 광륜: 마법진 바깥 둘레
}
if (mc.complete) analyze(); else mc.addEventListener('load', analyze);
addEventListener('resize', place);

let opened = false;
function enter(delay = 500) {
  if (opened) return; opened = true;
  if (v.srcObject) v.srcObject.getTracks().forEach(x => x.stop());
  setTimeout(() => document.body.classList.add('second'), delay);
}
$('ui-b2').onclick = enter;

/* ── 손 인식 (🤘: 검지·새끼 펴고, 중지·약지 접기) ── */
const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function fingers(lm) { const w = lm[0], r = (t, m) => d(w, lm[t]) / d(w, lm[m]);
  return { idx: r(8, 5), mid: r(12, 9), ring: r(16, 13), pinky: r(20, 17) }; }
const EXT = 1.5, FOLD = 1.4;   // 인식이 안 되면 EXT는 낮추고 FOLD는 높이세요
const isHorns = lm => { const f = fingers(lm); return f.idx > EXT && f.pinky > EXT && f.mid < FOLD && f.ring < FOLD; };
const LINES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

let landmarker, hold = 0, last = 0, lastT = -1;
const NEED = 1.1;

async function start() {
  $('ui-b1').disabled = true; seal.classList.add('using');
  msg.textContent = '카메라를 불러오는 중…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 640 } });
    v.srcObject = stream; await v.play();
    const { HandLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await HandLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
      runningMode: 'VIDEO', numHands: 1 });
    cam.classList.add('live'); msg.textContent = '';
    $('ui-b1').style.visibility = 'hidden';
    last = performance.now(); requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    msg.textContent = e.name === 'NotAllowedError' ? '카메라 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.' : '손 인식을 불러오지 못했습니다: ' + (e.name || '') + ' ' + (e.message || e);
    seal.classList.remove('using'); $('ui-b1').disabled = false;
  }
}
$('ui-b1').onclick = start;

function loop(now) {
  if (opened) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (v.readyState >= 2 && v.currentTime !== lastT) {
    lastT = v.currentTime; cv.width = v.videoWidth; cv.height = v.videoHeight;
    ctx.clearRect(0, 0, cv.width, cv.height);
    let res; try { res = landmarker.detectForVideo(v, now); } catch (e) { console.error(e); return requestAnimationFrame(loop); }
    const hand = res.landmarks && res.landmarks[0];
    let ok = false;
    if (hand) {
      ok = isHorns(hand);
      ctx.strokeStyle = ctx.fillStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (const [a, b] of LINES) { ctx.beginPath(); ctx.moveTo(hand[a].x * cv.width, hand[a].y * cv.height); ctx.lineTo(hand[b].x * cv.width, hand[b].y * cv.height); ctx.stroke(); }
      for (const p of hand) { ctx.beginPath(); ctx.arc(p.x * cv.width, p.y * cv.height, 4, 0, 7); ctx.fill(); }
    }
    hold = ok ? hold + dt : Math.max(0, hold - dt * 0.5);
    ring.classList.toggle('on', ok || hold > 0.05);
    prog.style.strokeDashoffset = 1000 - Math.min(1, hold / NEED) * 1000;
    if (hold >= NEED) { document.body.classList.add('pact'); return enter(3400); }
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
